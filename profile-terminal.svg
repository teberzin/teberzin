<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Baha Tan Oral — game designer, game studies researcher, founder of Vesvese Studios</title>
  <desc id="desc">A PS1 survival-horror research terminal interface presenting Baha Tan Oral's professional identity.</desc>
  <defs>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.20"/>
      <rect y="2" width="4" height="2" fill="#d9d2b6" opacity="0.018"/>
    </pattern>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#8b9272" stroke-width="0.7" opacity="0.10"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101310"/>
      <stop offset="0.52" stop-color="#090b0a"/>
      <stop offset="1" stop-color="#12110e"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b493e"/>
      <stop offset="0.15" stop-color="#262820"/>
      <stop offset="0.8" stop-color="#10120f"/>
      <stop offset="1" stop-color="#4b493e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="8" fill="#050605"/>
  <rect x="7" y="7" width="1186" height="346" rx="6" fill="url(#metal)" stroke="#6f6b58" stroke-width="2"/>
  <rect x="14" y="14" width="1172" height="332" rx="4" fill="url(#panel)" stroke="#1f241e" stroke-width="3"/>
  <rect x="14" y="14" width="1172" height="332" fill="url(#grid)"/>

  <!-- Left navigation -->
  <rect x="26" y="26" width="190" height="308" fill="#0a0c0a" stroke="#4f5043" stroke-width="2"/>
  <rect x="36" y="36" width="170" height="40" fill="#171a16" stroke="#5d5b4c"/>
  <text x="121" y="62" text-anchor="middle" fill="#cfc8aa" font-family="monospace" font-size="18" letter-spacing="4">MENU</text>

  <g font-family="monospace" font-size="17" letter-spacing="2">
    <polygon points="45,101 55,107 45,113" fill="#d7b77a" filter="url(#softGlow)"/>
    <text x="65" y="113" fill="#e5d5b0" font-weight="700">PROFILE</text>
    <text x="65" y="151" fill="#777b70">RESEARCH</text>
    <text x="65" y="189" fill="#777b70">PROJECTS</text>
    <text x="65" y="227" fill="#777b70">ARCHIVE</text>
    <text x="65" y="265" fill="#777b70">NOTES</text>
  </g>

  <!-- Abstract moth / eye mark -->
  <g transform="translate(121 301)" stroke="#8f8b70" fill="none" opacity="0.55">
    <ellipse cx="0" cy="0" rx="52" ry="22" stroke-width="1"/>
    <path d="M0-20 0 20M-4-12-22-25M4-12 22-25M-4 10-26 24M4 10 26 24" stroke-width="1.3"/>
    <path d="M-4-8C-28-25-48-10-42 8-30 12-18 8-4 0M4-8C28-25 48-10 42 8 30 12 18 8 4 0"/>
    <circle cx="0" cy="0" r="4" fill="#8f8b70"/>
  </g>

  <!-- Main identity -->
  <g transform="translate(250 0)">
    <text x="0" y="96" fill="#e5dfc7" font-family="Georgia, serif" font-size="58" letter-spacing="5" filter="url(#softGlow)">BAHA TAN ORAL</text>
    <line x1="0" y1="113" x2="630" y2="113" stroke="#777662" stroke-width="1.5"/>

    <text x="0" y="151" fill="#9fa582" font-family="monospace" font-size="17" letter-spacing="1.5">GAME DESIGNER</text>
    <text x="160" y="151" fill="#666a59" font-family="monospace" font-size="17">·</text>
    <text x="182" y="151" fill="#9fa582" font-family="monospace" font-size="17" letter-spacing="1.5">GAME STUDIES RESEARCHER</text>
    <text x="0" y="180" fill="#9fa582" font-family="monospace" font-size="17" letter-spacing="1.5">FOUNDER — VESVESE STUDIOS</text>

    <line x1="0" y1="204" x2="630" y2="204" stroke="#55584a" stroke-width="1"/>
    <text x="0" y="246" fill="#d1c6a7" font-family="monospace" font-size="20" letter-spacing="2">MAKE STRANGE THINGS.</text>
    <text x="0" y="276" fill="#d1c6a7" font-family="monospace" font-size="20" letter-spacing="2">EXAMINE THEM SERIOUSLY.</text>

    <text x="0" y="318" fill="#5f6455" font-family="monospace" font-size="13" letter-spacing="1.2">PROFILE ID: BTO-027  /  STATUS: ACTIVE  /  SIGNAL: STABLE</text>
  </g>

  <!-- Research terminal -->
  <g transform="translate(915 36)" font-family="monospace">
    <path d="M0 18V0H18M240 0H258V18M0 256v18h18M240 274h18v-18" fill="none" stroke="#737959" stroke-width="1.5"/>
    <text x="22" y="31" fill="#8e956c" font-size="15" letter-spacing="2">RESEARCH TERMINAL</text>
    <text x="22" y="53" fill="#61664f" font-size="12">V.0.1.97</text>
    <line x1="22" y1="66" x2="236" y2="66" stroke="#535843" stroke-dasharray="5 5"/>
    <text x="22" y="94" fill="#6d7259" font-size="12">SUBJECT:</text>
    <text x="22" y="116" fill="#929974" font-size="13">EXPERIMENTAL NARRATIVE</text>
    <text x="22" y="136" fill="#929974" font-size="13">&amp; INTERACTIVE SYSTEMS</text>
    <text x="22" y="164" fill="#6d7259" font-size="12">STATUS: OBSERVING...</text>

    <!-- low-poly die -->
    <g transform="translate(150 189) rotate(-8)">
      <path d="M-42-28 10-38 43-9 28 38-26 43-49 4Z" fill="#77786d" stroke="#b0ad99" stroke-width="1.5"/>
      <path d="M-42-28 10-38 8 3-49 4Z" fill="#949487" opacity="0.8"/>
      <path d="M8 3 43-9 28 38-26 43-49 4Z" fill="#55584f" opacity="0.95"/>
      <circle cx="-19" cy="-17" r="5" fill="#171916"/>
      <circle cx="-2" cy="-5" r="5" fill="#171916"/>
      <circle cx="-31" cy="-1" r="5" fill="#171916"/>
      <circle cx="19" cy="13" r="5" fill="#171916"/>
      <circle cx="5" cy="25" r="5" fill="#171916"/>
      <circle cx="29" cy="27" r="5" fill="#171916"/>
    </g>
    <ellipse cx="150" cy="238" rx="74" ry="15" fill="none" stroke="#5f624d" opacity="0.5"/>
    <text x="22" y="260" fill="#60654e" font-size="11">MEANING IS AN EMERGENT PROPERTY.</text>
  </g>

  <!-- CRT overlays -->
  <rect x="14" y="14" width="1172" height="332" fill="url(#scanlines)" pointer-events="none"/>
</svg>
